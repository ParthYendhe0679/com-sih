services:
  # Mode 2: FastAPI Backend connected directly to Cloud Neon PostgreSQL
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kritagas_backend_neon
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
